spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:realworld}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:lention}

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${WEBHOOK_SECRET}
  checkout:
    order:
      success-url: ${STRIPE_ORDER_SUCCESS_URL:}
      cancel-url: ${STRIPE_ORDER_CANCEL_URL:}
    subscription:
      success-url: ${STRIPE_SUBSCRIPTION_SUCCESS_URL:}
      cancel-url: ${STRIPE_SUBSCRIPTION_CANCEL_URL:}
