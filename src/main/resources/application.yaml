spring:
  profiles:
    active: local

  datasource:
    url: jdbc:mysql://localhost:3306/realworld?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: lention

  application:
    name: realworld-backend

  data:
    redis:
      host: localhost
      port: 6379
      password:
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
          max-wait: 5000ms

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${WEBHOOK_SECRET:}
  checkout:
    order:
      success-url: ${STRIPE_ORDER_SUCCESS_URL:http://localhost:3000/order-success}
      cancel-url: ${STRIPE_ORDER_CANCEL_URL:http://localhost:3000/order-cancel}
    subscription:
      success-url: ${STRIPE_SUBSCRIPTION_SUCCESS_URL:http://localhost:3000/success?session_id={CHECKOUT_SESSION_ID}}
      cancel-url: ${STRIPE_SUBSCRIPTION_CANCEL_URL:http://localhost:3000/cancel}
