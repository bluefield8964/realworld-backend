services:
  mysql:
    image: mysql:8.4
    container_name: realworld-mysql-prod
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      TZ: ${TZ:-Asia/Taipei}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: realworld-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    container_name: realworld-backend-prod
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?WEBHOOK_SECRET is required}
      STRIPE_ORDER_SUCCESS_URL: ${STRIPE_ORDER_SUCCESS_URL:?STRIPE_ORDER_SUCCESS_URL is required}
      STRIPE_ORDER_CANCEL_URL: ${STRIPE_ORDER_CANCEL_URL:?STRIPE_ORDER_CANCEL_URL is required}
      STRIPE_SUBSCRIPTION_SUCCESS_URL: ${STRIPE_SUBSCRIPTION_SUCCESS_URL:?STRIPE_SUBSCRIPTION_SUCCESS_URL is required}
      STRIPE_SUBSCRIPTION_CANCEL_URL: ${STRIPE_SUBSCRIPTION_CANCEL_URL:?STRIPE_SUBSCRIPTION_CANCEL_URL is required}
      TZ: ${TZ:-Asia/Taipei}

volumes:
  mysql_data:
  redis_data:
